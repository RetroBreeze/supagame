openapi: 3.1.0
info:
  title: Supabase Game Services API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Contract for a single game installed in the developer's own Supabase
    project.

    Every application request includes the project's publishable key in the
    apikey header.

    OPTIONS preflight requests require no credentials. The handler returns 204
    for configured

    origins; Supabase's gateway may answer preflight itself with 200 and broader
    CORS headers.

    Actual application requests still enforce the configured origin allowlist.

    Disallowed origins or database permissions return 403 FORBIDDEN. Unknown
    routes return

    404 NOT_FOUND; unsupported methods return 405 METHOD_NOT_ALLOWED with an
    Allow header.

    Write requests require uncompressed application/json with UTF-8 encoding;
    unsupported

    media types or encodings return 415 UNSUPPORTED_MEDIA_TYPE. Unknown or
    repeated query

    parameters return 400 INVALID_REQUEST (repeated cursors return
    INVALID_CURSOR).

    Player routes also require a verified Supabase Auth JWT (anonymous or
    permanent).

    No request accepts a caller-supplied player identity for writes.

    Scores are PostgreSQL BIGINT values restricted in JSON to
    Number.isSafeInteger(score).

    Leaderboard/profile bodies are limited to 4096 UTF-8 bytes. Save bodies
    allow 2 MiB transport overhead; JSON data is limited by the installed save
    configuration (maximum 1 MiB). Binary bytes travel directly to private
    Storage after reservation. Errors are flat ApiError objects.
servers:
  - url: /functions/v1/supagame/v1
paths:
  /leaderboards:
    get:
      operationId: listLeaderboards
      summary: List enabled leaderboards
      security:
        - PublishableKey: []
      responses:
        "200":
          description: Enabled boards only; an empty list is valid.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /leaderboards/{id}/entries:
    parameters:
      - $ref: "#/components/parameters/LeaderboardId"
    get:
      operationId: getLeaderboardEntries
      summary: Read a page of ranked, visible entries
      description: >
        asc means smaller scores are better; desc means larger scores are
        better.

        Equal scores share competition rank (1, 1, 3). Display order is score,

        achievedAt ascending, then playerId ascending. Hidden players are
        excluded.

        Cursors encode board ID and the last score/achievement time/player ID
        tuple.

        A malformed cursor or one for another board is rejected. Continuation is

        deterministic for unchanged data; pages are not a snapshot across score
        updates.
      security:
        - PublishableKey: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque continuation token from nextCursor; omit on the first page.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Ranked page with an opaque next cursor, or null at the end.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /leaderboards/{id}/me:
    parameters:
      - $ref: "#/components/parameters/LeaderboardId"
    get:
      operationId: getMyScore
      summary: Read the authenticated player's visible best score and competition rank
      security:
        - PublishableKey: []
          PlayerSession: []
      responses:
        "200":
          description: The current player's entry, or null when no visible score exists.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/MyScore"
                  - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /leaderboards/{id}/scores:
    parameters:
      - $ref: "#/components/parameters/LeaderboardId"
    post:
      operationId: submitScore
      summary: Atomically submit a score for the authenticated player
      description: >
        Retains one personal best per board. Equal or worse scores return
        not_best.

        The server derives identity from the verified JWT. Reusing a
        submissionKey

        with the same score replays the original result; a different score
        conflicts.

        Submissions are limited to 10 per player per board per rolling 60
        seconds.

        Board bounds and enabled state are enforced by the server. Range checks
        and

        per-identity rate limits cannot prove legitimate gameplay or prevent
        account farming.
      security:
        - PublishableKey: []
          PlayerSession: []
      requestBody:
        required: true
        description: JSON body, at most 4096 UTF-8 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitScoreRequest"
      responses:
        "200":
          description: Accepted best or valid non-improvement; replays return the original
            result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitScoreResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /players/me:
    get:
      operationId: getMyProfile
      summary: Read or create the authenticated player's profile
      security: &a1
        - PublishableKey: []
          PlayerSession: []
      responses:
        "200":
          description: The current player's profile; displayName is null until set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401": &a2
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateMyProfile
      summary: Update the authenticated player's display name
      description: Trim surrounding whitespace and validate 3–24 printable characters.
      security:
        - PublishableKey: []
          PlayerSession: []
      requestBody:
        required: true
        description: JSON body, at most 4096 UTF-8 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerRequest"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /achievements:
    get:
      operationId: getAchievements
      summary: All definitions and current player progress; reads never award
        achievements
      security: *a1
      responses:
        "200":
          description: Achievements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementList"
        "401": *a2
  /saves:
    get:
      operationId: listSaves
      security:
        - PublishableKey: []
          PlayerSession: []
      responses:
        "200":
          description: SaveList
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveList"
        "400":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /saves/cleanup:
    post:
      operationId: cleanupSaves
      security:
        - PublishableKey: []
          PlayerSession: []
      responses:
        "200":
          description: SaveObjects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveObjects"
        "400":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /saves/{slot}:
    parameters:
      - name: slot
        in: path
        required: true
        schema: &a3
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$
    get:
      operationId: loadSave
      security:
        - PublishableKey: []
          PlayerSession: []
      responses:
        "200":
          description: SaveResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"
        "400":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: mutateSave
      security:
        - PublishableKey: []
          PlayerSession: []
      responses:
        "200":
          description: SaveResult
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SaveResult"
                  - $ref: "#/components/schemas/SaveUpload"
                  - $ref: "#/components/schemas/SaveObjects"
                  - $ref: "#/components/schemas/SaveRevisionList"
        "400":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: JSON save/delete, binary prepare/commit/abort, or revisions/loadRevision/restore.
        backupExisting=true archives the displaced valid save transactionally (five per slot,
        30 days, counted against player quota). Restore always archives the current save.
        Revisions returns SaveRevisionList; loadRevision returns SaveResult. Prepare returns
        SaveUpload; abort returns SaveObjects. expectedRevision=0 is
        create-only. Every successful mutation is idempotent by operationId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMutation"
components:
  securitySchemes:
    PublishableKey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase project publishable key; never a privileged key.
    PlayerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Valid, unexpired Supabase Auth JWT for an anonymous or permanent user.
  parameters:
    LeaderboardId:
      name: id
      in: path
      required: true
      description: Unique leaderboard slug.
      schema:
        type: string
        minLength: 1
  schemas:
    SafeInteger:
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: A JSON number satisfying Number.isSafeInteger; stored as BIGINT for
        scores.
    LeaderboardSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - sortDirection
        - minValue
        - maxValue
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - time
            - points
        sortDirection:
          type: string
          enum:
            - asc
            - desc
        minValue:
          description: Inclusive configured minimum, or null for no additional minimum.
          anyOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        maxValue:
          description: Inclusive configured maximum, or null for no additional maximum.
          anyOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
    LeaderboardEntry:
      type: object
      additionalProperties: false
      required:
        - playerId
        - displayName
        - score
        - rank
        - achievedAt
      properties:
        playerId:
          type: string
          format: uuid
        displayName:
          anyOf:
            - $ref: "#/components/schemas/DisplayName"
            - type: "null"
        score:
          $ref: "#/components/schemas/SafeInteger"
        rank:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Competition rank; tied scores share rank (1, 1, 3).
        achievedAt:
          type: string
          format: date-time
          description: Authoritative server timestamp when this personal best was achieved.
    LeaderboardPage:
      type: object
      additionalProperties: false
      required:
        - entries
        - nextCursor
      properties:
        entries:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        nextCursor:
          type:
            - string
            - "null"
          description: Opaque continuation token, or null when there are no more entries.
    MyScore:
      $ref: "#/components/schemas/LeaderboardEntry"
    SubmitScoreRequest:
      type: object
      additionalProperties: false
      required:
        - score
        - submissionKey
      properties:
        score:
          $ref: "#/components/schemas/SafeInteger"
        submissionKey:
          type: string
          format: uuid
          description: Client-generated UUID, reused unchanged when retrying the same
            submission.
    SubmitScoreResult:
      type: object
      additionalProperties: false
      required:
        - outcome
        - score
        - bestScore
      properties:
        outcome:
          type: string
          enum:
            - best
            - not_best
        score:
          $ref: "#/components/schemas/SafeInteger"
        bestScore:
          $ref: "#/components/schemas/SafeInteger"
    DisplayName:
      type: string
      minLength: 3
      maxLength: 24
      pattern: ^[^\u0000-\u001F\u007F-\u009F]+$
      description: 3–24 printable characters after trimming surrounding whitespace.
    PlayerProfile:
      type: object
      additionalProperties: false
      required:
        - playerId
        - displayName
        - createdAt
      properties:
        playerId:
          type: string
          format: uuid
        displayName:
          anyOf:
            - $ref: "#/components/schemas/DisplayName"
            - type: "null"
        createdAt:
          type: string
          format: date-time
    UpdatePlayerRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          $ref: "#/components/schemas/DisplayName"
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code, as documented for each HTTP
            status.
        message:
          type: string
          description: Public explanation without SQL details, credentials or tokens.
        current:
          anyOf:
            - $ref: "#/components/schemas/SaveRecord"
            - type: "null"
          description: Latest slot on SAVE_CONFLICT (null if absent); keep the attempted
            local copy.
    Achievement:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - description
        - icon
        - category
        - metadata
        - progress
        - unlocked
        - unlockedAt
        - historical
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        icon:
          type:
            - string
            - "null"
        category:
          type:
            - string
            - "null"
        metadata:
          type: object
          additionalProperties: true
        progress:
          type: object
          additionalProperties: false
          required:
            - current
            - threshold
          properties:
            current:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            threshold:
              type: integer
              minimum: 0
              maximum: 9007199254740991
        unlocked:
          type: boolean
        unlockedAt:
          type:
            - string
            - "null"
          format: date-time
        historical:
          type: boolean
    AchievementList:
      type: array
      items:
        $ref: "#/components/schemas/Achievement"
    SaveRecord:
      type: object
      additionalProperties: false
      required:
        - slot
        - revision
        - schemaVersion
        - kind
        - metadata
        - sizeBytes
        - deleted
        - createdAt
        - updatedAt
        - objectPath
      properties:
        slot: *a3
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        schemaVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        kind:
          type: string
          enum:
            - json
            - binary
        metadata:
          type: object
          additionalProperties: true
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        deleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        objectPath:
          type:
            - string
            - "null"
        data: {}
    SaveList:
      type: object
      additionalProperties: false
      required:
        - slots
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SaveRecord"
    SaveResult:
      type: object
      additionalProperties: false
      required:
        - save
      properties:
        save:
          $ref: "#/components/schemas/SaveRecord"
    SaveUpload:
      type: object
      additionalProperties: false
      required:
        - upload
      properties:
        upload:
          type: object
          additionalProperties: false
          required:
            - bucket
            - path
            - operationId
          properties:
            bucket:
              type: string
              const: supagame-saves
            path:
              type: string
            operationId:
              type: string
              format: uuid
    SaveObjects:
      type: object
      additionalProperties: false
      required:
        - objects
      properties:
        objects:
          type: array
          items:
            type: string
    SaveRevision:
      type: object
      additionalProperties: false
      required: [save, archivedAt, expiresAt]
      properties:
        save:
          $ref: "#/components/schemas/SaveRecord"
        archivedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    SaveRevisionList:
      type: object
      additionalProperties: false
      required: [revisions]
      properties:
        revisions:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SaveRevision"
    SaveMutation:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedRevision
            - operationId
            - schemaVersion
            - metadata
            - data
          properties:
            action:
              const: save
              type: string
            backupExisting:
              type: boolean
            expectedRevision: &a4
              type: integer
              minimum: 0
              maximum: 9007199254740991
            operationId: &a5
              type: string
              format: uuid
            schemaVersion: &a6
              type: integer
              minimum: 1
              maximum: 2147483647
            metadata: &a7
              type: object
              additionalProperties: true
            data: {}
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedRevision
            - operationId
          properties:
            action:
              const: delete
              type: string
            backupExisting:
              type: boolean
            expectedRevision: *a4
            operationId: *a5
        - type: object
          additionalProperties: false
          required:
            - action
            - expectedRevision
            - operationId
            - schemaVersion
            - metadata
            - sizeBytes
            - checksum
          properties:
            action:
              const: prepare
              type: string
            backupExisting:
              type: boolean
            expectedRevision: *a4
            operationId: *a5
            schemaVersion: *a6
            metadata: *a7
            sizeBytes:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            checksum:
              type: string
              pattern: ^[0-9a-f]{64}$
        - type: object
          additionalProperties: false
          required:
            - action
            - operationId
          properties:
            action:
              const: commit
              type: string
            operationId: *a5
        - type: object
          additionalProperties: false
          required:
            - action
            - operationId
          properties:
            action:
              const: abort
              type: string
            operationId: *a5
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              const: revisions
        - type: object
          additionalProperties: false
          required: [action, revision]
          properties:
            action:
              type: string
              const: loadRevision
            revision: &backupRevision
              type: integer
              minimum: 1
              maximum: 9007199254740991
        - type: object
          additionalProperties: false
          required: [action, revision, expectedRevision, operationId]
          properties:
            action:
              type: string
              const: restore
            revision: *backupRevision
            expectedRevision: *a4
            operationId: *a5
    SavePreparation:
      oneOf:
        - $ref: "#/components/schemas/SaveUpload"
        - $ref: "#/components/schemas/SaveResult"
  responses:
    BadRequest:
      description: INVALID_REQUEST, INVALID_SCORE, INVALID_CURSOR or INVALID_DISPLAY_NAME.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: UNAUTHORIZED — missing/invalid project key or
        missing/invalid/expired required player JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: LEADERBOARD_NOT_FOUND — board does not exist or is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: DUPLICATE_KEY_CONFLICT — submissionKey was already used with a
        different score.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — request body exceeds 4096 UTF-8 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: RATE_LIMITED — exceeded 10 submissions per player per board per
        rolling 60 seconds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: INTERNAL_ERROR — generic failure with no internal implementation details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: FORBIDDEN — origin or database operation is not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    MethodNotAllowed:
      description: METHOD_NOT_ALLOWED — unsupported method; includes an Allow header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE — use uncompressed application/json with
        UTF-8 encoding.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
