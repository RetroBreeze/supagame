# Isolated local database/API fixture. Never link this to a hosted project.
project_id = "supagame-schema-tests"

[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Test against Supabase's permissive default grants; migrations must revoke them.
auto_expose_new_tables = true

[db]
port = 55432
shadow_port = 55430
major_version = 17
health_timeout = "2m"

[db.seed]
enabled = false

[studio]
enabled = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[local_smtp]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
inspector_port = 55433

[auth]
enabled = true
site_url = "http://localhost:55431"
enable_anonymous_sign_ins = true

[auth.email]
enable_confirmations = false

[functions.supagame]
enabled = true
verify_jwt = false
entrypoint = "../../../../modules/leaderboards/functions/supagame/index.ts"
