# Isolated, local-only Task 2 database fixture. Never link this to a hosted project.
project_id = "supagame-schema-tests"

[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Test against Supabase's permissive default grants; migrations must revoke them.
auto_expose_new_tables = true

[db]
port = 55432
shadow_port = 55430
major_version = 17
health_timeout = "2m"

[db.seed]
enabled = false

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[local_smtp]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
