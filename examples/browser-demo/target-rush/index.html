<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171b22">
  <meta name="description" content="A simple 30-second target game.">
  <title>Target Rush</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%2388b8ad'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23171b22'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2388b8ad'/%3E%3C/svg%3E">
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>Target Rush</h1>
      <button id="mute" aria-label="Mute sound" aria-pressed="false">Sound on</button>
    </header>
    <section class="dashboard" aria-label="Round statistics">
      <div><span class="label">Score</span><strong id="score">0</strong></div>
      <div><span class="label">Time</span><strong id="timer">30.0</strong></div>
      <div><span class="label">Multiplier</span><strong id="combo">×1</strong></div>
    </section>
    <section class="arena" aria-label="Target Rush playfield">
      <canvas id="game" width="900" height="675" aria-label="Tap or click the circular targets during a round"></canvas>
      <section id="intro" class="overlay" aria-label="Start round">
        <p>Hit targets for 30 seconds.</p>
        <button class="primary" id="start">Start</button>
      </section>
      <section id="results" class="overlay" hidden aria-labelledby="result-title">
        <h2 id="result-title">Round complete</h2>
        <div class="final-score"><span class="label">Score</span><strong id="final-score">0</strong></div>
        <div class="result-stats">
          <div><strong id="hits">0</strong><span class="label">Hits</span></div>
          <div><strong id="accuracy">0%</strong><span class="label">Accuracy</span></div>
          <div><strong id="best-combo">0</strong><span class="label">Best streak</span></div>
        </div>
        <div id="leaderboard-slot"></div>
        <button class="primary" id="restart">Play again</button>
      </section>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
