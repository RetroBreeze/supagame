name: Release validation (no publication)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-packages:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        supabase: [3.0.0, 3.1.0]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - name: Select checksum-verified Supabase CLI for this matrix entry
        run: node scripts/select-test-supabase.ts "${{ matrix.supabase }}"
      - name: Actual CLI flags, JSON serialization and unattended consent
        run: pnpm test:cli:compatibility
        env:
          SUPABASE_TEST_VERSION: ${{ matrix.supabase }}
      - run: pnpm -r build
      - name: Install Chromium for browser helper tests
        run: pnpm exec playwright install chromium
      - name: CLI, SDK, browser demo and API contract unit regressions
        run: pnpm test
      - run: pnpm test:edge
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm contracts:check
      - name: Install and verify actual npm tarballs (no publication)
        run: pnpm test:packages
  local-integration:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        supabase: [3.0.0, 3.1.0]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - name: Select checksum-verified Supabase CLI for this matrix entry
        run: node scripts/select-test-supabase.ts "${{ matrix.supabase }}"
      - name: Actual CLI flags, JSON serialization and unattended consent
        run: pnpm test:cli:compatibility
        env:
          SUPABASE_TEST_VERSION: ${{ matrix.supabase }}
      - run: pnpm -r build
      - name: Install Chromium without optional font-package downloads
        run: pnpm exec playwright install chromium
      - name: Create loopback-only regression network
        run: docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 supagame-schema-tests-local
      - id: local
        run: pnpm api:start
      - run: pnpm db:migrate
      - run: pnpm test:db
      - run: pnpm test:cli:db
      - run: pnpm test:edge:integration
      - run: pnpm test:sdk:integration
      - name: Stop only the regression fixture
        if: always() && steps.local.outcome != 'skipped'
        run: pnpm db:stop
      - name: Fresh tarball installation, local backend, raw HTTP and Chromium browser demo
        run: pnpm test:e2e
