name: Release validation (no publication)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-packages:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        supabase: [3.0.0, 3.1.0]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          # No cache here: bundled npm fails the repository devEngines check.
      - name: Install the pinned development package manager
        run: npm install --global npm@12.2.0
        working-directory: ${{ runner.temp }}
      - run: node --version
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Select checksum-verified Supabase CLI for this matrix entry
        run: node scripts/select-test-supabase.ts "${{ matrix.supabase }}"
      - name: Actual CLI flags, JSON serialization and unattended consent
        run: npm run test:cli:compatibility
        env:
          SUPABASE_TEST_VERSION: ${{ matrix.supabase }}
      - run: npm run build
      - name: Install Chromium for browser helper tests
        run: npm exec -- playwright install chromium
      - name: CLI, SDK, browser demo and API contract unit regressions
        run: npm test
      - run: npm run test:edge
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run contracts:check
      - name: Install and verify actual npm tarballs (no publication)
        run: npm run test:packages
  local-integration:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        supabase: [3.0.0, 3.1.0]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          # No cache here: bundled npm fails the repository devEngines check.
      - name: Install the pinned development package manager
        run: npm install --global npm@12.2.0
        working-directory: ${{ runner.temp }}
      - run: node --version
      - run: npm ci
      - name: Select checksum-verified Supabase CLI for this matrix entry
        run: node scripts/select-test-supabase.ts "${{ matrix.supabase }}"
      - name: Actual CLI flags, JSON serialization and unattended consent
        run: npm run test:cli:compatibility
        env:
          SUPABASE_TEST_VERSION: ${{ matrix.supabase }}
      - run: npm run build
      - name: Install Chromium without optional font-package downloads
        run: npm exec -- playwright install chromium
      - name: Create loopback-only regression network
        run: docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 supagame-schema-tests-local
      - id: local
        run: npm run api:start
      - run: npm run db:migrate
      - run: npm run test:db
      - run: npm run test:cli:db
      - run: npm run test:edge:integration
      - run: npm run test:sdk:integration
      - name: Verify SDK teardown leaves a healthy database fixture
        run: npm run test:cli:db
      - name: Stop only the regression fixture
        if: always() && steps.local.outcome != 'skipped'
        run: npm run db:stop
      - name: Fresh tarball installation, local backend, raw HTTP and Chromium browser demo
        run: npm run test:e2e
